/* =========================================================
   SITE CODE — no need to edit below
   (optional per-piece field:  date: "March 2024")
   ========================================================= */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const baseTitle = document.title;

  /* ----- Data prep ----- */
  const wordCount = t => t.trim().split(/\s+/).length;
  const lead = p => p.text.split("\n").find(l => l.trim()).trim();
  const blurb = p => p.subtitle || (lead(p).length > 130 ? lead(p).slice(0, 127).trimEnd() + "…" : lead(p));
  const pad = i => String(i + 1).padStart(2, "0");
  POEMS.forEach(p => {
    p.mins = Math.max(1, Math.round(wordCount(p.text) / 200));
    p.hay = [p.title, p.category, p.subtitle, p.text].join(" ").toLowerCase();
  });
  const metaOf = p => [p.category, p.mins + " min read", p.date].filter(Boolean);
  const metaEl = (p, cls) => { const m = el("div", "meta ui " + (cls || "")); metaOf(p).forEach(t => m.append(el("span", "", t))); return m; };

  /* ----- Theme ----- */
  const themeBtn = $("#theme-btn");
  function setTheme(t, save) {
    root.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    themeBtn.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " mode");
    $('meta[name="theme-color"]').content = t === "dark" ? "#241A2D" : "#3C2C49";
    if (save) try { localStorage.setItem("igs-theme", t); } catch (e) {}
  }
  setTheme(root.dataset.theme);
  themeBtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);

  /* ----- Mobile menu ----- */
  const menuBtn = $("#menu-btn"), navList = $("#nav-list");
  const setMenu = open => { navList.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); menuBtn.textContent = open ? "Close" : "Menu"; };
  menuBtn.onclick = () => setMenu(!navList.classList.contains("open"));
  navList.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

  /* ----- Static content ----- */
  $("#tagline").textContent = SITE.tagline;
  $("#foot").textContent = SITE.title + " · © " + new Date().getFullYear() + " " + SITE.name;
  const cats = [...new Set(POEMS.map(p => p.category))];
  $("#arch-total").textContent = POEMS.length + " pieces · " + cats.length + " categories";

  const feat = POEMS.find(p => p.featured) || POEMS[0];
  const fBox = $("#feat");
  const fi = POEMS.indexOf(feat);
  const fText = el("div");
  const fq = el("blockquote", "", feat.text.split("\n").filter(l => l.trim()).slice(0, 4).join("\n").slice(0, 320));
  const fh = el("h3"); const fa = el("a", "", feat.title); fa.href = "#/poem/" + feat.id; fh.append(fa);
  const fr = el("a", "link-arrow", "Read the full piece"); fr.href = fa.href;
  fText.append(metaEl(feat), fh, fq, fr);
  fBox.append(el("div", "feat-n", pad(fi)), fText);
  fBox.firstChild.setAttribute("aria-hidden", "true");

  const cl = $("#contact-list");
  const addContact = (label, text, href) => {
    const d = el("div"); d.append(el("span", "ui", label), el("br"));
    const a = el("a", "", text); a.href = href; d.append(a); cl.append(d);
  };
  if (SITE.email) addContact("Email", SITE.email, "mailto:" + SITE.email);
  if (SITE.phone) addContact("Mobile", SITE.phone, "tel:" + (SITE.phoneHref || SITE.phone));
  SITE.social.forEach(s => { if (s.href) addContact("Elsewhere", s.label, s.href); });

  /* ----- Archive: search + filter ----- */
  const state = { q: "", cat: "All" };
  const q = $("#q"), list = $("#list"), count = $("#count"), empty = $("#empty"), clear = $("#clear");
  const chips = $("#chips");
  ["All", ...cats].forEach(c => {
    const b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", c === "All");
    b.onclick = () => { state.cat = c; render(); };
    chips.append(b);
  });
  function render() {
    [...chips.children].forEach(b => b.setAttribute("aria-pressed", b.textContent === state.cat));
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const out = POEMS.filter(p => (state.cat === "All" || p.category === state.cat) && terms.every(t => p.hay.includes(t)));
    list.replaceChildren();
    out.forEach(p => {
      const li = el("li"), a = el("a", "row"); a.href = "#/poem/" + p.id;
      const body = el("div"); body.append(el("h3", "", p.title), el("p", "", blurb(p)));
      a.append(el("span", "num", pad(POEMS.indexOf(p))), body, metaEl(p));
      li.append(a); list.append(li);
    });
    const filtered = terms.length || state.cat !== "All";
    count.textContent = filtered ? out.length + (out.length === 1 ? " piece" : " pieces") + " found" : "Showing all " + POEMS.length + " pieces";
    empty.hidden = out.length > 0;
    clear.hidden = !state.q;
  }
  const clearSearch = () => { state.q = ""; q.value = ""; render(); };
  q.addEventListener("input", () => { state.q = q.value; render(); });
  clear.onclick = () => { clearSearch(); q.focus(); };
  $("#reset").onclick = () => { state.cat = "All"; clearSearch(); q.focus(); };

  /* ----- Reactions, share & comments -----
     Saved in the visitor's own browser (localStorage). For counts and comments
     that everyone can see, this needs a small online database (see notes). */
  const FB_KEY = "igs-feedback-v1";
  const fbLoad = () => { try { return JSON.parse(localStorage.getItem(FB_KEY)) || {}; } catch (e) { return {}; } };
  const fbSave = d => { try { localStorage.setItem(FB_KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };
  const pieceUrl = p => (SITE.url || location.href.split("#")[0]) + "#/poem/" + p.id;
  const svg = inner => { const w = el("span"); w.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + inner + "</svg>"; return w.firstChild; };
  const THUMB = '<path d="M7 11v9H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3zM7 11l4-8a2.2 2.2 0 0 1 2.2 2.4L12.8 9H19a2 2 0 0 1 2 2.3l-1.1 7A2 2 0 0 1 17.9 20H7"/>';
  const SHARE = '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/>';

  function feedbackEl(p) {
    const data = fbLoad(), rec = data[p.id] || (data[p.id] = { vote: null, comments: [] });
    const sec = el("section", "fb"); sec.setAttribute("aria-label", "Reactions, sharing and comments");
    const bar = el("div", "fb-bar"), note = el("p", "fb-note"); note.setAttribute("aria-live", "polite");
    const say = t => { note.textContent = t; };
    const persist = () => { if (!fbSave(data)) say("Couldn’t save in this browser (private mode?)."); };

    const btn = (cls, label, icon) => { const b = el("button", "fb-btn " + cls); b.type = "button"; b.append(svg(icon), el("span", "", label)); return b; };
    const like = btn("up", "Like", THUMB), dis = btn("down", "Dislike", THUMB);
    const paint = () => {
      like.setAttribute("aria-pressed", rec.vote === "like"); dis.setAttribute("aria-pressed", rec.vote === "dislike");
    };
    const vote = v => {
      rec.vote = rec.vote === v ? null : v; paint(); persist();
      say(rec.vote === "like" ? "Thank you — I’m glad this found you." : rec.vote === "dislike" ? "Thanks for being honest. Tell me what didn’t land in the comments below." : "");
    };
    like.onclick = () => vote("like"); dis.onclick = () => vote("dislike");

    /* Share */
    const wrap = el("div", "fb-share"), sb = btn("", "Share", SHARE), menu = el("ul", "fb-menu");
    sb.setAttribute("aria-haspopup", "true"); sb.setAttribute("aria-expanded", "false"); menu.hidden = true;
    const url = pieceUrl(p), msg = "“" + p.title + "” — " + SITE.title + " by " + SITE.name;
    const setMenu = o => { menu.hidden = !o; sb.setAttribute("aria-expanded", o); };
    const item = (label, node) => { const li = el("li"); li.append(node); menu.append(li); node.append(label); return node; };
    const copy = el("button"); copy.type = "button";
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(url); say("Link copied."); }
      catch (e) { prompt("Copy this link:", url); }
      setMenu(false);
    };
    item("Copy link", copy);
    [["WhatsApp", "https://wa.me/?text=" + encodeURIComponent(msg + "\n" + url)],
     ["X / Twitter", "https://twitter.com/intent/tweet?text=" + encodeURIComponent(msg) + "&url=" + encodeURIComponent(url)],
     ["Facebook", "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url)],
     ["Email", "mailto:?subject=" + encodeURIComponent(p.title) + "&body=" + encodeURIComponent(msg + "\n" + url)]
    ].forEach(([l, h]) => { const a = el("a"); a.href = h; a.target = "_blank"; a.rel = "noopener noreferrer"; a.onclick = () => setMenu(false); item(l, a); });
    sb.onclick = async () => {
      if (navigator.share) {
        try { await navigator.share({ title: p.title, text: msg, url }); } catch (e) { /* cancelled */ }
      } else setMenu(menu.hidden);
    };
    wrap.append(sb, menu);
    sec.addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { e.stopPropagation(); setMenu(false); sb.focus(); } });
    document.addEventListener("click", function off(e) {
      if (!sec.isConnected) return document.removeEventListener("click", off);
      if (!wrap.contains(e.target)) setMenu(false);
    });
    bar.append(like, dis, wrap); paint();

    /* Comments */
    const cm = el("div", "cm");
    const h = el("h2"); h.id = "cm-h"; cm.setAttribute("aria-labelledby", "cm-h");
    cm.append(h, el("p", "cm-lead", "Tell me what this stirred in you, what worked, what didn’t. Honest words are welcome."));
    const form = el("form", "cm-form"); form.noValidate = false;
    const name = el("input"); name.type = "text"; name.maxLength = 40; name.placeholder = "Your name (optional)"; name.setAttribute("aria-label", "Your name (optional)"); name.autocomplete = "name"; name.value = data._name || "";
    const ta = el("textarea"); ta.required = true; ta.maxLength = 1000; ta.placeholder = "Write your feedback…"; ta.setAttribute("aria-label", "Your comment");
    const row = el("div", "cm-row"), lab = el("label", "cm-check"), cb = el("input"); cb.type = "checkbox";
    lab.append(cb, document.createTextNode("Also email this to " + SITE.name));
    const sub = el("button", "cm-submit", "Post comment"); sub.type = "submit";
    row.append(SITE.email ? lab : el("span"), sub); form.append(name, ta, row);
    const list = el("ul", "cm-list");
    cm.append(form, list);

    const fmt = t => new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    const drawComments = () => {
      const n = rec.comments.length;
      h.textContent = n ? "Comments (" + n + ")" : "Comments";
      list.replaceChildren();
      if (!n) { list.append(el("li", "cm-empty", "No comments yet. Be the first.")); return; }
      rec.comments.slice().reverse().forEach(c => {
        const li = el("li", "cm-item"), top = el("div", "cm-top"), who = el("div");
        who.append(el("span", "cm-who", c.n || "Anonymous"), el("span", "cm-when", fmt(c.d)));
        const del = el("button", "cm-del", "Delete"); del.type = "button";
        del.onclick = () => { if (confirm("Delete this comment?")) { rec.comments = rec.comments.filter(x => x !== c && x.d !== c.d); persist(); drawComments(); } };
        top.append(who, del); li.append(top, el("p", "cm-text", c.t)); list.append(li);
      });
    };
    form.onsubmit = e => {
      e.preventDefault();
      const t = ta.value.trim(), n = name.value.trim(); if (!t) { ta.focus(); return; }
      rec.comments.push({ n, t, d: Date.now() }); data._name = n; persist();
      if (cb.checked && SITE.email) {
        location.href = "mailto:" + SITE.email + "?subject=" + encodeURIComponent("Feedback on “" + p.title + "”") +
          "&body=" + encodeURIComponent(t + "\n\n— " + (n || "Anonymous") + "\n" + url);
      }
      ta.value = ""; cb.checked = false; drawComments(); say("Comment posted.");
    };
    drawComments();
    sec.append(bar, note, cm);
    return sec;
  }

  /* ----- Reader ----- */
  const reader = $("#reader"), home = $("#home"), piece = $("#piece"), bar = $("#progress");
  function showPiece(p) {
    const i = POEMS.indexOf(p), prev = POEMS[i - 1], next = POEMS[i + 1];
    piece.replaceChildren();
    const back = el("a", "back ui", "← Back to archive"); back.href = "#/archive";
    const head = el("header"), h1 = el("h1", "", p.title); h1.tabIndex = -1; h1.id = "piece-title";
    head.append(el("p", "ui cat", pad(i) + " · " + p.category), h1);
    if (p.subtitle) head.append(el("p", "sub", p.subtitle));
    const m = metaEl(p); m.firstChild.remove(); head.append(m);
    const prose = el("div", "prose"); prose.setAttribute("aria-labelledby", "piece-title");
    p.text.split(/\n\s*\n/).forEach(s => prose.append(el("p", "", s)));
    if (p.category === "Poem") prose.classList.add("verse");
    else if (wordCount(p.text) > 250 && /^["“]?[A-Za-z]/.test(p.text.trim())) prose.classList.add("dc");
    const pn = el("nav", "pn"); pn.setAttribute("aria-label", "More pieces");
    const link = (x, label, side) => { const a = el("a"); a.href = "#/poem/" + x.id; a.append(el("span", "ui", label), el("strong", "", x.title)); return a; };
    pn.append(prev ? link(prev, "← Previous") : el("span"), next ? link(next, "Next →") : el("span"));
    piece.append(back, head, prose, el("p", "orn", "✦ ✦ ✦"), feedbackEl(p), pn);
    document.title = p.title + " — " + SITE.title;
    window.scrollTo(0, 0); onScroll();
    h1.focus({ preventScroll: true });
  }
  function onScroll() {
    if (reader.hidden) return;
    const max = root.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, scrollY / max) : 0) + ")";
  }
  addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true });

  /* ----- Router ----- */
  const navLinks = [...document.querySelectorAll("#nav-list a")];
  const markNav = h => navLinks.forEach(a => a.getAttribute("href") === h ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
  let wasReader = false;
  function route() {
    const h = location.hash, m = h.match(/^#\/poem\/([\w-]+)/);
    const p = m && POEMS.find(x => x.id === m[1]);
    home.hidden = !!p; reader.hidden = !p; markNav(p ? "" : h);
    if (p) { wasReader = true; showPiece(p); return; }
    document.title = baseTitle; bar.style.transform = "scaleX(0)";
    const id = { "#/featured": "featured", "#/archive": "archive", "#/contact": "contact" }[h];
    requestAnimationFrame(() => {
      if (id) $("#" + id).scrollIntoView({ behavior: reduce || wasReader ? "auto" : "smooth" });
      else window.scrollTo(0, 0);
      wasReader = false;
    });
  }
  addEventListener("hashchange", route);

  /* ----- Keyboard: "/" focuses search, Esc clears / closes ----- */
  addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      if (reader.hidden) q.focus(); else { location.hash = "#/archive"; setTimeout(() => q.focus(), 80); }
    } else if (e.key === "Escape") {
      if (navList.classList.contains("open")) { setMenu(false); menuBtn.focus(); }
      else if (document.activeElement === q || state.q) { if (state.q) clearSearch(); else q.blur(); }
      else if (!reader.hidden) location.hash = "#/archive";
    }
  });

  /* ----- Section entrances (skipped for reduced motion) ----- */
  if ("IntersectionObserver" in window && !reduce) {
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .06 });
    document.querySelectorAll(".block .wrap").forEach(n => { n.classList.add("rv"); io.observe(n); });
  }

  render(); route();
})();
</script>
