{
  id: "dear-pops",
  title: "Dear Pops",
  subtitle: "a letter never mailed",
  category: "Poem",
  featured: true,
  text: `Dear Pops,
or should I say,
Contributor of Chromosomes,
thank you... for the name,
five syllables long and lacking in meaning—
but hey, you did your part.
I carry it like a surname-shaped ghost,
a shadow stitched to my signature,
a trophy from a race you never ran.

You dialed once—twice,
perhaps to check
if gravity still kept me grounded
or if oxygen still liked my lungs.
No birthday calls,
but hey—who needs candles
when your absence burns better?

You boast twenty children.
Impressive.
A human factory
with no quality control.
Was I number six? Or seventeen?
Hard to tell when your affection
comes with a waiting list.

You once told me,
“Son, I’m proud of you.”
But I had just sneezed.
Guess your standards
were surprisingly allergic to effort.

I rang your phone once—
cracked voice, broken pride,
and you answered with silence
so loud, it killed hope in stereo.
That day I learned
real men cry
into their own ribcages.

My first memory of you
was in prison.
How poetic.
Barred windows, locked hearts—
you were free inside
but jailed in my mind.
You smelled of rust and regrets,
and still tried to teach me
how to be a man
from behind Plexiglas wisdom.
Spoiler alert: I learned anyway—
mostly by watching what not to be.

You see, Pops,
I don’t hate you.
Hate takes effort.
I just put you on a dusty shelf
in the museum of missed fathers,
somewhere between
"Unreliable" and "Unavailable."

So cheers—
to the name you gave,
to the child you forgot,
and to this poem you’ll never read.
Sincerely,
Your afterthought.`

{
  id: "life-is-a-gamble",
  title: "Life Is a Gamble",
  subtitle: "",
  category: "Composition",
  featured: false,
  text: `To wake each morning is to place a wager with a dealer who never shows his hand. You stir from sleep, take a breath, and call it certainty — but certainty is a luxury the living only borrow, never own outright. You have buried friends who once believed, as fiercely as you do now, that tomorrow was a debt owed to them. It wasn't. Tomorrow owes no one anything. And yet, absurdly, magnificently, you rise anyway. You plan anyway. You set alarms for a future that has never once signed a contract guaranteeing your presence in it. That is not foolishness — that is faith wearing the disguise of routine, the quiet defiance of a gambler who keeps playing not because the odds favor him, but because folding is its own kind of death.

You are told that discipline is destiny — that if you study hard enough, sit still enough, memorize enough, the gates of opportunity will part for you like water before a prophet. But the world is not so obedient to merit. You can graduate top of your class and still watch the door stay shut, while someone less studious walks through it on the arm of a connection you never had. The classroom teaches you theory; the workplace teaches you truth, and the two rarely speak the same language. You arrive at your first job clutching a certificate like a talisman, only to discover it opens the gate but does not walk the path — that is done through trial, through the humbling apprenticeship of error, through the slow accumulation of scars that no lecture hall ever mentioned. Months later, you are competent not because of what you were taught, but because of what you survived.

And when you finally sit behind the desk with your name on the door, be honest with yourself: the title is not a coronation of your brilliance. It is a wager that paid off — a chair reserved by a piece of paper as much as by your mind. Countless others, equally sharp, equally relentless, are still waiting for their card to be drawn. Do not mistake the fall of the dice for the weight of your own hand. Humility is simply gambling with your eyes open.

You love again after love has already betrayed you once, twice, more — and each time you convince yourself this is the hand that finally holds a full house. You said the same the last time, and the time before that, and still the table cleared you out. Yet here you sit, chips in hand, heart in hand, betting on a stranger's permanence in a world where even your own permanence is unconfirmed. That is not naivety. That is the terrifying, stubborn romance of being human — to know the house usually wins, and to sit down and play anyway.

You build a business on hope alone — no customers promised, no revenue guaranteed, only a vision and a checkbook you empty like a libation poured to gods who may or may not be listening. You raise a child the way you'd plant a seed in soil whose composition you cannot see — watering it daily, praying the roots go where you intend, knowing full well that some seeds twist toward the light and others toward the rot. A daughter's future can be undone by a single reckless night. A son's ambition can be hijacked by the wrong street corner, the wrong friend, the wrong needle. You do everything right and still lose. You do everything wrong and still, somehow, win. The dice do not consult your effort before they land.

And still — still — you climb into the very car that betrayed your friend yesterday, engine humming beneath you like a held breath, and you drive to bury him. Because grief does not exempt you from risk; it merely reminds you, cruelly, intimately, that you are still enrolled in the same game he just lost.

So yes — life is a gamble, from the first involuntary breath to the last. Every plan is a bet placed against a future that refuses to reveal its cards. Every love is a wager staked on a heart not yet proven trustworthy. Every child raised, every business opened, every road traveled is a coin tossed into a well too deep to hear it land. We do not live because we are certain. We live because uncertainty, somehow, has never once been reason enough to stop playing.`
},

  id: "we-met-on-twitter",
  title: "We Met on Twitter",

  category: "Composition",
  featured: false,
  text: `When I joined Twitter in 2019, the digital streets throbbed with a single chant — #WeMetOnTwitter.
 A public confessional where strangers fell in love loudly, recklessly, and in public threads. Pixels became promises. Timelines turned into bedrooms of imagination. Love had learned a new dialect — hashtags, retweets, and late-night lies.
Out of curiosity — or fate being drunk at the wheel — I wandered in too.
She appeared on my timeline like trouble wrapped in elegance — tall, poised, dangerously beautiful even through the cheap blue glare of my phone. Her name was Kauthara. A Muslim woman. Graceful. Soft-spoken. The kind of beauty that makes a man forget the rules he swore by.
 Why a Muslim, when I’m Catholic? Simple. Fascination. The mystery. The way modesty can look like virtue until you touch it and realize it burns just like everything else.
She was two years older than me. A small detail. The kind you ignore until it starts screaming at you in hindsight.
For three months, our “love” lived online — texts, emojis, midnight calls soaked in longing. COVID had locked the world indoors, but desire doesn’t obey curfews. Distance became an excuse. Fantasy did the heavy lifting.
Then came the call.
Her voice wasn’t just seductive — it was dirty in a quiet way. Low. Slow. Intentionally careless. She spoke like she knew exactly what she was doing to my head. Words slid through the speaker and straight into my bloodstream. If sin had a ringtone, that was it.
Two days later, I decided to meet her.
The country was on lockdown. Roads dead. Movement illegal. Common sense screaming don’t.
 I walked anyway — Mengo to Seeta — like a fool chasing a body instead of a future. The sun punished me, my legs cursed me, but lust kept whispering, keep going. Love, or whatever this bullshit was, is the most convincing liar alive.
By noon, I arrived — broken, sweating, proud of my stupidity. She looked shocked, impressed, pleased. We talked. Laughed. Pretended this was normal. By evening, the sky was orange and she asked if I could massage her back.
I wasn’t a masseuse. I was worse — a man already halfway gone.
When she undressed, morality didn’t argue. It packed its bags and left.
 She was temptation in human form. And I — brilliant idiot — followed my body and shut down my brain.
That night, I did something I swore I never would.
 No protection. No test. No pause.
 Just raw impulse and blind trust.
The kind of mistake that makes you feel invincible in the moment and terrified in the silence after. The kind that sends grown men into whispered prayers and sleepless nights.
The days that followed were a blur of flesh, food, and foolishness. Sex bled into naps. Netflix filled the gaps. Desire kept looping like a broken playlist. She was sweet, dangerous, exhausting — and I let myself drown in it.
But fear is a patient bastard.
It crept in quietly. Every itch became a sentence. Every cough felt like judgment day. I replayed that night over and over, realizing how casually I had gambled my life for a few hours of pleasure. Lust doesn’t care about consequences — it clocks out the moment it’s satisfied.
Then the cracks showed.
She asked for Smirnoff and Tusker while shopping. Casual. Confident. Another red flag.
 Her apartment was too nice. Too expensive. Somebody else was funding that lifestyle, and it wasn’t God.
Still, I stayed. Because men are stupid when they think they’re special. I believed I could change her — fix her — save her.
 What arrogance.
She had many male “friends.” Later I learned they weren’t friends — they were rotations. She told me she’d slept with over sixty men. Said it calmly. Like she was listing countries she’d visited.
The final slap came hard.
I showed up unannounced and watched a man leave her apartment. Same boda boda that brought me took him away. She claimed she didn’t know how he ended up in her bed. Blamed weed. Blamed memory. Blamed everything except herself.
That’s when my body broke before my heart did. Panic. Tight chest. Shallow breaths. Reality finally punched through denial.
I left — not because I was strong, but because I was done bleeding dignity.
I had danced with the devil and expected loyalty.
That’s when I learned the ugliest truth: people don’t change — they just stop pretending. Love isn’t about saving someone. It’s about choosing which flaws you can live with before they destroy you.
I loved her. My Samie.
 I saw the red flags and painted them white. I lowered my standards. Bent my values. Shrunk myself — all for someone who wouldn’t have noticed if I disappeared.
For six months after, I tested for HIV like a ritual of repentance. Every negative result felt like mercy I didn’t deserve. I even suspected she wanted to infect me — she didn’t.
 But fear doesn’t need facts. It feeds on regret.
In the end, I learned this:
 Love found on timelines can vanish like a tweet — loud when it’s trending, forgotten when it’s deleted. And sometimes, what you call love is just appetite dressed up in poetry.
That night didn’t just cost me peace — it taught me that desire without discipline is just self-harm wearing pleasure’s face.`

  id: "Namata",
  title: "Namata",
  subtitle: "The Girl Who Belonged to No One",
  category: "Composition",
  featured: false,
  text: `She was twenty-one, and in all those years the mirror had never once insulted her, because she had never given it the chance. Hers was not a face anyone would call handsome. Her body was a drawing of a life of insufficiency and violence that had grown up right alongside her, the only companion who never left. Her skin was a faded black, worn down like the gutters of a slum. A black veil always covered her face, partly to hide her shame and partly to hide the pimples planted there like abandoned seeds that grow anyway, the only crop in her life that ever flourished without someone's cruelty to water it. People did not stare at her for long; some looked away so fast they risked a sprained neck. They said she was ugly and rude. She was, by every account, the most talked-about person nobody wanted to talk to.

Her mother never said who her father was and then, as if to keep the mystery tidy, died when Namata was four. Her aunt, her mother's sister, was a woman so hard that nails were rumoured to ask her for advice, and she was hardest on children she had not laboured to bring into the world. She gave Namata a life worse than prison, I think, for prisoners are at least fed on schedule. The poor black girl woke before the cockerel and worked until the sun gave up. Denied an education, she grew up worshipping her aunt as the all-powerful being who sustained her survival, which was ironic, since the aunt was also its greatest threat. Her punishments were what Auntie Damali called "good beatings," and they came as faithfully as church on Sunday. Her rewards were something close to normal treatment, the kind Auntie Damali's own children received without even asking.

Her solace was the radio, a local channel had a program where listeners wrote letters to the presenter who read them affectionately and beautifully. This was her favourite, even though most letters were those of doom and catastrophe. Her mind was built on someone doing something wrong to another, that she didn’t know any life of happiness and love. The television set, like the sofa set were sacred family assets tailored for auntie Damali’s children and guests.

As misery and hopelessness took their toll, time, the Creator's most powerful agent, went on eating. The lies told to a four-year-old become irrelevant to an eight-year-old, just as those told to a ten-year-old no longer work on a fifteen-year-old, as realities set in and the beautiful childhood is eaten, or in this case, robbed. Namata grew up like a stubborn weed among cherished crops, thriving on nothing, and earning for it only the farmer's hatred.

At sixteen, she became pregnant. Auntie Damali screamed so loudly that three villages learned the news before Namata did. She was cursed and cast out of the "pure" home, the same pure home where she had been beaten daily, a purity that evidently ran on bruises. The poor girl had met one of the roaming boys of the town out of boredom, though the fires of youth had never burned in her. Her body began to change and she did not know why. She had no one to ask, so she took whatever lessons anyone cared to offer. Perhaps the boy had been her only friend, the one she could genuinely smile at, the one to whom she could tell everything in her little mind without the fear she felt around Auntie Damali. Her expulsion was cruel and theatrical. Her five dresses were thrown in her face, slaps and shouts landing with them, while the neighbours watched with the devotion of a congregation, scorn in every row.

The silly, foolish creature could not even trace the boy, who had vanished faster than the last bottle at a wedding. Her plan was to find something to eat and sleep by the roadside. But in the night, after tears upon tears, something pulled her toward a nightclub. It may have been the music, or it may have been instinct. She left her bag at the entrance and, with eight thousand five hundred shillings, the entire fortune of her life, went in to see. Before long, someone offered her a bottle of beer. She had tasted beer before, stealing a bottle from a birthday party at home, and she considered herself, therefore, an experienced woman of the world.

"What do you drink?" he whispered in her ear.

"Anything," she answered.

He went to the counter and ordered a Nile Special.

Her last memory of that night was of almost finishing the bottle. She woke on a bed beside someone she did not know. Her clothes were still on, and so were his, but she could not tell what had happened. When he woke, he looked shocked at what he found, as if astonished that alcohol had chosen so badly on his behalf. He said quickly that he was late and had to leave, then asked where the girl lived. To his surprise, she said she had no home.

"You must still leave," he said.

He checked his wallet and gave her twenty thousand shillings, a sum he apparently believed could buy off a whole misfortune. She did not take it, and he did not know what to do, so he raised his voice and shouted at her to go. As she had always done when shouted at, she ran to a corner and coiled herself small.

"I don't have anywhere to go. My auntie chased me out because I'm pregnant," she said, foolishly.

"Then go to your husband."

"I can't find him. He left the village."

Godfrey was confused, but he let her stay while he went to work. She did herself a great favour. By evening she had cleaned and arranged the place so well that the cockroaches had filed for emigration. Godfrey returned half expecting to find his property missing, or ready to throw out a thief, and instead found a floor in which he could see his own regrets. He could do nothing but listen to her.

He was an educated, employed man in a season of life where the bar meant something. The girl was not his type on any day of the week, and it was only because his head had not been sound that he spoke to her at all. But he asked what she could do, and she said, "Anything." She had already shown, in a single afternoon, that she was a magician of cleaning. Godfrey was a budding businessman who ran a fruit shop and had struggled to find staff. A business that needs cleanliness and good timing needs a hard worker, and he had just been handed one by a hangover. She was the luckiest of creatures, though no one, least of all she, would have called it luck.

She was excellent, as high as the sky. She struggled with sales, for it is hard to sell fruit from behind a veil, but never with delivery or work rate. The business began with one refrigerator, and as daily subscribers came on board, it grew to four. She rented a room, gave birth, and took good care of her child. As the years flew by, they began supplying supermarkets and companies, and the girl nobody wanted to look at became the one face every customer trusted. Godfrey married and brought his wife in as supervisor. She came with an open spirit and grew fond of Namata for her hard work. When they moved into a big house, Namata had a self-contained two-room house of her own, and a sofa set that no one but her was ever allowed to dust. She lived with dignity and satisfaction in all that she held.

By then, the Kingdom of Buganda had been restored, and a new regime had taken Kampala. One of the King's sons, and one of the most powerful princes, returned from exile. Among the first things he did was visit the grave of Namata's mother. Then he began an investigation to trace his only child, to whom he would give everything. The late King had left him, in his will, a large share of the unimaginable wealth he had possessed.

And so, somewhere in Kampala, a woman who had been told all her life that she belonged to no one was wiping a fruit counter, unaware that half a kingdom was looking for her.
`

  title: "Suzie",

  text: `*I call her Sue*

Tall and slender as an African giraffe,
with a warm brown complexion
that seems to borrow its glow
from the African sun.

Beautiful beyond the vocabulary of description—
the kind of beauty that makes language
feel suddenly inadequate.

Because her eyes are almond seeds,
bright as morning breaking over the Sahara,
carrying a softness that somehow
still knows how to command attention.

Because her lips resemble dry red wine—
rich, delicate,
quietly intoxicating,
sweet enough to tempt the eyes
before the tongue ever gets a chance.

Because every feature upon her
seems measured by some invisible hand—
not too much,
not too little,
but precisely enough.

Her brown skin catches the light
with an effortless warmth,
the kind that needs no filter,
no artificial glow,
no borrowed definition of beauty.

The Ankole beauty in you
is nothing like the stereotypes they sell.

You are not merely a pretty girl.
You are what happens
when nature becomes unreasonably generous—
when grace takes human form
and decides to walk among ordinary people.

Beautiful in and out,
like a fruit ripened beneath the sun,
untouched by artificial sweetness.

Without makeup—beautiful.
With makeup—still beautiful.

The makeup does not create you;
it merely accompanies
what was already there.

Your complexion,
your eyes,
your smile,
the quiet architecture of your face—
everything seems to exist
in a strange agreement with itself.

As though you were a rare species
created with nothing but love,
then deliberately placed outside the ordinary
because you were never meant
to belong to every crowd.

You are a beauty and a half.

And talent—
that is where beauty begins to lose the argument.

For what good is a beautiful face
when the soul has nothing to say?

But you have something to say.

You carry a soul so infectious
it spreads affection like wildfire,
moving from person to person
without asking permission.

There is something about you
that makes warmth contagious.

And yet,
when evening folds itself around you,
you sometimes look inward
and convince yourself
that you are not enough.

That you are unworthy.

That somehow
you stand beneath a standard
you were never supposed to meet.

And honestly,
I sometimes wonder—

**what kind of weed are you smoking?**

Suzie,

you are better than me.

Not in poetry.
Not in compliments.
Not because I say so.

But in the quiet mathematics of character—
in the things you do
when nobody is watching.

You are better than many men
who speak loudly about strength,
and better than millions
who have been praised for beauty
they did nothing to earn.

So don't.

Don't ever make another human being
the author of your worth.

Don't hand someone else
the pen with which your identity is written.

You don't need their validation.

You only need to be—

**you.**

Brown-skinned beneath the African sun.
Beautiful without permission.
Brilliant without announcement.
Imperfectly extraordinary
without needing anyone to certify it.

Keep becoming.

Keep growing.

Keep being Suzie.

Because beauty may catch the eye,
but character keeps the memory.

And somehow,
in ways you cannot yet see,

everything—
I repeat, **everything**—
will fall into place.
`

inexcusable as passion,
yet sweet as a melody I cannot stop humming,
and it devours my mind like a hood drawn over the eyes.

and everything else dissolves,
like a heartbroken lover
clinging to someone who no longer cares.

too splendid to be true,

in an unfortunate place
during a board meeting.

  text: `At eighteen, life opens differently for each soul.
For a young woman, the world already seems to notice her. She carries beauty, youth, and promise — her value, in society’s eyes, shines effortlessly. She doesn’t have to earn attention; it finds her. Yet, the greatest test she faces is how to protect it. Her choices matter — not because she lacks worth, but because she’s already born with it.

For a young man, eighteen is not a celebration of value — it’s a call to arms. The world does not hand him recognition; it demands proof. He stands with empty pockets but an open horizon. His worth is not inherited — it is built, brick by brick, failure by failure, lesson by lesson.

At twenty-five, the paths begin to diverge.
The woman starts searching for stability, for love that complements her dreams. The man, still forging his path, chases goals, status, and the version of himself he hopes will someday be enough. One looks for meaning, the other for purpose — both running, both trying not to fall behind.

At thirty, nature reveals its rhythm.
The woman, once pursued, now slows her pace — not because she has failed, but because her heart seeks rest. The man, hardened by years of struggle, begins to rise. What once looked like failure now feels like foundation. His story is just beginning where hers seeks peace.

But these are not rules — they are reflections.
Nature does not discriminate; it simply observes. Every woman carries the grace of creation; every man carries the burden of becoming. One protects, one builds — and both, when wise, learn from each other.

The law of nature is balance — not rivalry.
A woman’s worth is in her wisdom; a man’s power is in his patience. When both meet in understanding, life itself becomes harmony — and time stops being a competition.`

  featured: false,
  text: `There exists within me an echo—subtle, shadowed, and often shunned. Would you dare to meet it? Most wouldn't. Not because it is grotesque, but because it is true. It is the part of me that emerges not by invitation but by provocation—triggered, never scheduled. It does not knock. It erupts.

They say a man who trembles in anger is unstable. They do not know the tremble is the body’s last negotiation before it turns volcanic. I am not ashamed of the echo; it is my hidden hymn, my midnight confession. And yet, it is not for all ears. Some secrets do not hide from fear—they hide from misunderstanding.

The echo of me is a paradox. To some, I am a villain, a cold stone of a man, unyielding and selfish. To others, I am warmth itself, compassion dressed in skin. The contradiction is not a mask—it is the truth of duality. I am both. I am neither. The echo shapeshifts, responding not to the world but to the world's gaze.

There is a life I offer to the public—a curated gallery of moments, polished and palatable. Then there is the life I live in whispers, revealed only to the rare few who do not flinch when the curtain falls. The echo lives in that hidden chamber, behind the grin, behind the achievements, behind the roles I am forced to perform in society’s cruel theater.

Behind every "perfect" face is an ache—one so carefully veiled it becomes art. Perfection, after all, is not a goal; it is a survival instinct. We learn early that flawlessness earns affection. That mistake is shame. That silence is honor. So we build palaces of compliance and die slowly in their gardens.

I mastered the act—smiled when the heart shattered, agreed when the soul rebelled. I buried my questions in layers of "respect," sealed my dreams with the ribbon of “duty.” I did not forget myself. I exiled myself. For love. For validation. For peace.

But love that requires silence is not love. It is performance. And performances end.

Still, I must confess: I love the echo of me. It is not polished. It is not holy. It is not safe. But it is mine. In its defiance, I find clarity. In its rebellion, I find home. The things it loves may seem dark, perhaps even sinful by society’s standards, but in them I feel the closest thing to freedom. I do not ask to be understood. I ask only not to be imprisoned by others' comfort zones.

Some say I am hard to love. But tell me, how do you love when love has been weaponized? How do you trust when the world rewards the performance and punishes the truth?

The echo of me has sinned. It has broken commandments, disappointed elders, shaken fists at the heavens. But it has also loved deeply, protected fiercely, and created beauty in the most unlikely places. Let those who judge remember: saints walk beside sinners, and often share the same face.

The echo is lonely. Not for company—but for belonging. There is no room in this world for the misfit soul, the inconvenient truth, the disobedient heart. But I would rather be alone in my authenticity than adored in my disguise.

Sometimes I wonder—have I been living my own life or someone else’s dream? The echo of me knows the answer. It reminds me of the sacrifices I made in the name of duty, of love. I became the perfect child. The perfect friend. The perfect partner. But the cost? I no longer belonged to myself.

I handed over the pen that wrote my story. And in return, I received applause for a character I no longer recognized.

So now, I reclaim it. The echo. The story. The sorrow. The joy.

Let the world call it what it will.

I call it me.

“People judge me like they past perfect Like they present pretty Like they future flawless. Like in this world we don't have drug addicts, alcoholics liars, rap!sts, murderers, robbers. We all sinning Idgaf what you call it”

Young MA.`

{
  id: "is-this-a-letter",
  title: "Is This a Letter?",
  subtitle: "A Monologue of Pain, Growth, and Conviction",
  category: "Composition",
  featured: false,
  text: `Is this a letter?
Maybe not in the traditional sense—no pen, no paper, no envelope inked with a return address. But it feels like one. A letter addressed to the void, to the unseen hands of time, to anyone willing to listen without judgment. Perhaps, most of all, a letter to myself—to the man I’ve become, shaped not by ease but by affliction.

I’ve lived a life most wouldn’t understand—not because it’s rare, but because it’s unspoken. People only see what you choose to show. What they don't see are the silent battles, the restless nights, the betrayals cloaked in friendship, or the pain that forges your voice into quiet steel.

I’ve known pain intimately. Not the kind that passes with time, but the kind that redefines you. Pain that stripped away comfort, burned bridges I never built, and left me walking barefoot on broken dreams. And yet, I endure. Why? Because I’ve chosen to only keep supportive people in my life. It’s not a preference; it’s survival. When you’ve been shattered enough, you learn to only trust the hands that have held you without hurting you.

For me, failure isn’t about missed chances or career missteps—it’s the inability to be a good man to those around me. A failure to be present. To not show up. I fear making the wrong move on this chessboard called life. Every choice feels like a strategy, and every misstep could be irreversible. So I tread with caution, guided by pain, but not paralyzed by it.

In a world that often disappoints, there’s only been one constant—my mother. She’s the lighthouse in every storm. No matter how rough the sea, she shows up. Always. And that kind of loyalty, that love, it’s rare. It's sacred. I lean on her like the roots of a tree lean into the earth—quietly, but with everything I've got.

I admit, I’m insecure about jobs. I don't get attached. I don't stick around. Maybe it’s fear, maybe it’s trauma. I’ve never found safety in permanence. But if I could go back in time, I wouldn’t change a damn thing. This journey—this pain, this joy, this heartbreak—it’s made me the man I am today. And you know what? I’m proud of him. There’s no regret in these scars. They’re the proof I survived.

When it comes to love, I’ve only truly been in two relationships. The rest? Situationships. Many of them. Fleeting connections that never learned my middle name, let alone my soul. But I don’t blame them. I’ve grown. And that growth—painful as it was—paved the way for deeper love.

Still, I have red flags I don’t negotiate on. A party animal? Red flag. Indecent dressing? That’s another. Showbiz personalities or people with too many “friends”? I don’t trust that. I guess that’s why most of my serious relationships have been with Muslim women—modest, grounded, not loud with the world but rich with dignity.

Being a man to me isn’t about muscle or money—it’s about presence. Emotional presence. Being there in someone’s darkest hour. That’s what makes a good father, a good brother, a good friend. It’s what I needed from my own father, but never got. Now that he tries to show up? I hate it. I hate the performance of care that never existed when it mattered most.

So yes, I’ve seen darkness. More than I care to admit. And it’s changed me—permanently. I don't believe in the naive goodness of people anymore. I’ve been used. Lied to. Envy disguised as praise. Kindness repaid with indifference. People want you to rise, just not higher than them. And when you do? Suddenly, they forget every good thing you ever did. Gratitude fades, but bitterness? Bitterness sticks around like a shadow.

Is this a letter?
Maybe not.
But if it is—then it’s a letter carved in stone, not ink. A declaration, not a plea. I don’t seek pity. I seek understanding. I am who I am because life gave me no other choice.

And I wouldn't have it any other way.

Written by IGS

“Don’t expect others to give you what you give them”`

  text: `At eighteen, a woman stands at the crossroads of life — full of dreams, curiosity, and possibilities. It’s the dawn of her becoming, where every choice she makes begins to shape the woman she will one day be. At that age, she may not yet understand the depth of her value, but it is already there — radiant, divine, and undeniable. She is born with worth; it does not come from validation, attention, or approval. It is hers by birthright. Her responsibility is to recognize it, protect it, and never allow the world to convince her otherwise.

  text: `There is a particular kind of sin they do not warn you about in seminary.

Not the loud ones — the ones with names, with weight, with chapters and verses assigned to their prosecution. No. I mean the quiet sin. The one that lives behind the sternum. The one that never announces itself, never breaks a commandment outright, yet dismantles a man more thoroughly than any transgression scripture ever bothered to catalogue.

I met mine in Gayaza.

Her name was Halima.

She arrived the way all genuinely dangerous things do — without warning, without apology, and entirely unaware of the damage she was causing simply by existing. The boda engines on that road had always sounded like noise to me. After her, I could've sworn they were church bells, slow and deliberate, ringing in something I had no liturgy for.

The sun, I am convinced, began rising earlier that season. Not out of cosmic duty. Out of competition. It had heard about her smile and was losing.

Village painters laid down their brushes. Not in defeat — in reverence. There are things you do not attempt. You do not argue with thunder. You do not race a river. You do not take a brush to what God has clearly spent overtime on.

Halima was one of those things.

I was training my tongue for sermons then. I had memorized the cadence of scripture, the architecture of a good homily, the exact pause before "and let the church say Amen." Words were my vocation. Words were the only thing I had ever been sure of.

She cured me of that certainty in an afternoon.

The day she hugged me — briefly, innocently, the kind of hug that meant nothing to her and rearranged everything in me — I felt warmth move through my body like electricity through a building that had forgotten what light felt like. My knees, lifelong disciples of gravity, submitted their resignation letters on the spot. My tongue, that faithful servant of scripture, went completely dark.

Not one syllable survived her.

I stood there — a future priest, a boy who had rehearsed the Word — undone by a girl who hadn't even tried. Loving thy neighbour, they said. They did not specify the terms and conditions. They did not warn me about this neighbour.

Here is the irony that still cuts like altar wine on an empty stomach:

I was standing at a crossroads. One path led to the pulpit — to vestments and vespers, to a life of whispered Amens and Sunday morning certainty. The other path had no name yet. It smelled like her. It looked like whatever the rest of my life might have become if I had simply opened my mouth.

I chose neither.

I said nothing.

And silence, I have since learned, is not the absence of a decision. Silence is the decision. The one that lives longest. The one that follows you into every room you enter for the rest of your life and sits down uninvited.

Halima walked on.

Unaware that she had nearly recruited a priest into apostasy without lifting a finger. Unaware that somewhere behind her, a boy was holding a full congregation in his chest — rows of feeling, hymns of almost, a choir of everything he never sang aloud — and that the whole service had been held in her honour, and she had never once been told.

The collection plate was never passed.

The sermon was never preached.

The church of her remained open inside me, empty and echoing, the way all sacred spaces feel when no one comes.

Maybe that is the thing about love that stays in the throat.

It does not disappear. It does not dissolve quietly with time and good sense. It calcifies. It becomes architecture. It becomes the reason certain songs hit differently, the reason Gayaza still sounds like a word with too much meaning, the reason a grown man can close his eyes and still feel the exact temperature of a hug that lasted four seconds and lasted forever.

Confessed love, even when it falls — even when it lands wrong, even when it is not returned — at least it lived. It breathed open air. It had a beginning and an end and something to show for itself.

But a love left in the throat?

That one outlives everything. That one never gets a funeral.

So.

Father, forgive me.

For I have sinned — quietly, completely, and in the direction of Halima.

I held a sermon I never preached. I loved a girl who never knew.

I stood at the altar of something real and walked away without genuflecting.

And if that is apostasy — if choosing silence over courage makes a sinner of me —

then I confess it fully.

I confess it without shame.

I regret the silence.

I do not regret her.

This is yours. Every word of it earned.`

The Crooked Horn of Otieno

Chapter One: The Empty Promise

The sun rose lazily over the sprawling plains of Acholi land, painting the huts of Purongo village with a warm, golden hue. Birds sang in the mango trees, children’s laughter echoed from the footpaths, and women’s voices floated from the grinding stones as they prepared millet for the day. Amid this harmony, Ochieng, the younger brother, bent over the soil, his hands darkened with earth and sweat. His life was toil, yet his heart bore no malice.

But years passed, and promises remained empty gourds. When Ochieng asked for help to pay his bride price, Otieno sent only words, no coin. When his hut’s roof leaked in the rains, Otieno came with polished shoes, walked around the homestead, and left, having done nothing but offer advice. And when Ochieng’s child fell ill, his desperate calls went unanswered, though Otieno was said to be in Kampala, dining in lavish hotels and boasting of his “connections in the UN.”

But in the silence of his own homestead, Otieno thought differently. To him, Ochieng’s humility was weakness, his poverty a shame that reflected on him. “I cannot let him shine brighter than me,” he often muttered, adjusting his tie before the mirror. “He must always remember who the elder is.”

Kampala’s air was heavy with ambition. Boda-bodas weaved recklessly through traffic, skyscrapers cast their shadows over colonial buildings, and the hum of city life drowned the quiet wisdom of the villages. It was here that Otieno, now a man of twenty-nine, had secured his post at the United Nations. To outsiders, it was a badge of honor, a ticket into the ranks of influence. To Otieno, it was proof that he was above ordinary men.

He walked the corridors of glass buildings with an arrogance that could be smelled like perfume. He measured his worth not by the service he rendered, but by the thickness of his wallet and the prestige of his title. His colleagues quickly learned of his appetite for boasting. At lunchtime, while others ate in quiet conversation, Otieno spoke loudly of allowances, international workshops, and the “dollars that flowed like Nile water.”

Back in Acholi land, however, the truth could not remain hidden. The people of Purongo had ears sharper than the drums of a ceremony. They heard of his lies, his infidelity, his arrogance. Around the evening fires, the old men shook their heads.

“Otieno is like a leopard that strays too far from the bush,” one elder said. “He thinks himself a lion in the city, but the spirits see him still.”

The women grinding millet would murmur, “How can a man deny his own blood? A wife left like a widow, a child left without a father’s embrace?”

Even Ochieng, though ever forgiving, began to feel the weight of betrayal. He heard of his brother’s boasting—how Otieno described himself as self-made, as though no family, no village, no ancestors had paved the way for his rise. It was salt upon the wounds of his poverty.

Yet Otieno was deaf to whispers. His ears only welcomed praise, his eyes only saw himself. He lived clothed in the cloak of importance—fine suits, polished shoes, an ego tailored larger than his frame. He believed he was untouchable, immune to the laws of community and spirit.

But in Acholi wisdom, there is a saying: “The horn that grows too proud shall one day break against the tree.”

And Otieno’s crooked horn was growing heavier, curving toward its inevitable fracture.

Chapter Three: The Gentle Flame of Ochieng

While Otieno polished his shoes in Kampala’s towers, Ochieng bent his back beneath the Acholi sun. His fields were not rich, nor were his hands free of calluses, but his heart glowed with a warmth his brother had long lost.

He lived in a thatched homestead on the edge of Purongo, with his wife Ayaa and their two small children. Their lives were modest: mornings began with the pounding of millet, afternoons with the tending of goats, evenings with stories told by the fire. There were no cars, no polished offices, no accounts in foreign banks—only the rhythm of the land and the dignity of honest labor.

“See Ochieng,” the women said. “He may not wear suits or eat in hotels, but his heart is straight.”

For while one brother walked clothed in pride, the other carried the silent blessing of the spirits.

The day of reckoning does not arrive with drums; it creeps like a snake through grass, silent until it strikes. For Otieno, the beginning of his fall was almost invisible—small cracks that grew into chasms.

Meanwhile, his lies grew heavy. A woman he had courted in secret exposed him in public, revealing he had a wife and child he had long denied. The scandal spread like wildfire, reaching not only his workplace but also the ears of the community back home. His carefully woven image began to unravel.

The collapse of a man rarely comes like a lightning strike—it comes in waves, each heavier than the last. For Otieno, the waves had gathered, and the storm was now upon him.

In Kampala, his job slipped first. His supervisors, tired of his tardiness, arrogance, and scandals, called him into a glass-walled office. Their words were sharp, measured, and final:

“Otieno, the United Nations does not wear arrogance as its badge. We value service, not self-glorification. You have failed to uphold the standards of this institution. Consider this your last day.”

The dismissal fell like a spear to his chest. He walked out with his briefcase, his reflection in the polished windows mocking him—once a man of status, now an empty shell.

He turned to his friends, those he had once entertained with boasts and drinks. But they melted away like dew under the sun. One by one, they closed their doors, unwilling to be associated with a man whose prestige had vanished. The women he had pursued laughed in scorn; some even mocked him openly:
“Is this the great Otieno, who claimed to have dollars flowing like Nile water? Where are his riches now?”

At home, Akello had already made her choice. She gathered her belongings, her son clinging to her hand, and returned to her mother’s village. Her parting words were soft, but they cut deeper than any blade:

“You were given a family and chose strangers. You were given love and chose lies. May the spirits teach you what we could not.”

Alone, Otieno returned to Purongo, the very soil he once despised. He arrived not in a shining car, but on foot, dusty and hollow-eyed. The people, seeing him, did not jeer—Acholi wisdom forbids laughing at the fallen—but their silence was heavier than ridicule. Mothers pulled their children closer, elders avoided his greeting, and whispers floated like shadows: “The crooked horn has broken.”

Only Ochieng approached him, carrying the calmness of one whose life had never depended on pride. He placed a hand on his brother’s shoulder and said quietly:

“Otieno, greatness is not in the height of a man’s shadow, but in the steadiness of his steps. You ran too far from the truth, but the land still welcomes you back. Will you learn now?”

For the first time, Otieno’s arrogance cracked. His eyes welled with tears—not of self-pity, but of realization. He looked at his brother, the man he had despised, envied, and betrayed, and saw in him the strength he had always lacked.

The drums of the ancestors seemed to echo in his ears, whispering: A horn, once broken, cannot be straightened. But its fragments may still be carved into something useful.

And so Otieno’s story did not end in triumph, but in reckoning. His crooked horn had broken, but perhaps—if humility took root—he could still learn the wisdom of the soil he had long ignored.`

A voice you trusted
To speak when your own heart had already said no.

So I stood where you asked me to stand.

Not because I own your choices,
But because sometimes love means
Protecting someone's right to choose.

And perhaps that is the irony of our story:

Once, I wanted to be the man beside you.
Today, I am simply grateful
To be someone you can trust.

Maybe love does not always arrive
Wearing the name we expected.

Maybe sometimes it becomes friendship,
Brotherhood,
A safe place,
A person who listens
When the world becomes too loud.

So, Ellah,
My Melanin Queen,

Never let the disappointments of yesterday
Convince you that tomorrow has nothing beautiful waiting.

You are more than the men
Who failed to understand you.

More than the relationships
That ended before they should.

More than the people
Who saw your beauty but missed your heart.

You are a woman still becoming.

A model in the making.
A beautiful soul beneath beautiful skin.
A smile capable of electricity.
A hug capable of comfort.
A heart that has survived
More than most people know.

And when the right person finally comes,
May he not simply admire your curves,
Or your smile,
Or your beautiful melanin.

May he recognize the woman within them.

May he understand your silence.
Respect your boundaries.
Protect your peace.
Value your heart.
And never make you question
Whether you are worth choosing.

Until then,
keep walking, Melanin Queen.

Kampala may be full of beautiful women,
But there is only one Ellah.

And somewhere on the outskirts of this city,
I met her.

And I never quite forgot her.

My Melanin Queen.`
},
{
  id: "the-fear-line",
  title: "The Fear Line",
  subtitle: "",
  category: "Poem",
  featured: false,
  text: `Hundred years, we're dust and bone,
buried next to who we've known.
Two hundred, the memory's gone —
even blood forgets its own.
Three hundred, no name, no face, no sound,
like we were never on this ground.

That's why I fear God, never fear man.
Give back, never give in.
Beat odds, never beat women.
Reach highs, never reach limits.
Need minds, I don't need plenty —
paper burns but wisdom's endless.

See, if the clock's already ticking loud,
what's the point of chasing crowds?
I'd rather build a thing that's true
than build a name that fades on cue.
Three hundred years from now, my name is smoke —
but the way I moved, the code I spoke,
that's the seed, not the tree,
that's the root nobody sees.

So I move different, I move slow,
plant in people, watch it grow.
Not for statues, not for fame,
'cause stone forgets, and so does a name.
Just fear the One who knows the end,
give what you got, don't chase the trend,
lift the weak, never break the weaker,
reach for heights, never call them limits,
fill your mind before your pockets —
that's the only wealth time don't rob you of.

Three hundred years, I'll be a stranger's myth.
But the way I lived — that's what I leave with.`
}
];


/* =========================================================
   SITE CODE — no need to edit below
   (optional per-piece field:  date: "March 2024")
   ========================================================= */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const baseTitle = document.title;

  /* ----- Data prep ----- */
  const wordCount = t => t.trim().split(/\s+/).length;
  const lead = p => p.text.split("\n").find(l => l.trim()).trim();
  const blurb = p => p.subtitle || (lead(p).length > 130 ? lead(p).slice(0, 127).trimEnd() + "…" : lead(p));
  const pad = i => String(i + 1).padStart(2, "0");
  POEMS.forEach(p => {
    p.mins = Math.max(1, Math.round(wordCount(p.text) / 200));
    p.hay = [p.title, p.category, p.subtitle, p.text].join(" ").toLowerCase();
  });
  const metaOf = p => [p.category, p.mins + " min read", p.date].filter(Boolean);
  const metaEl = (p, cls) => { const m = el("div", "meta ui " + (cls || "")); metaOf(p).forEach(t => m.append(el("span", "", t))); return m; };

  /* ----- Theme ----- */
  const themeBtn = $("#theme-btn");
  function setTheme(t, save) {
    root.dataset.theme = t;
    themeBtn.textContent = t === "dark" ? "Light" : "Dark";
    themeBtn.setAttribute("aria-label", "Switch to " + (t === "dark" ? "light" : "dark") + " mode");
    $('meta[name="theme-color"]').content = t === "dark" ? "#0b0907" : "#f5eee2";
    if (save) try { localStorage.setItem("igs-theme", t); } catch (e) {}
  }
  setTheme(root.dataset.theme);
  themeBtn.onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", e => {
    let saved = null; try { saved = localStorage.getItem("igs-theme"); } catch (x) {}
    if (!saved) setTheme(e.matches ? "light" : "dark");
  });

  /* ----- Mobile menu ----- */
  const menuBtn = $("#menu-btn"), navList = $("#nav-list");
  const setMenu = open => { navList.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); menuBtn.textContent = open ? "Close" : "Menu"; };
  menuBtn.onclick = () => setMenu(!navList.classList.contains("open"));
  navList.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

  /* ----- Static content ----- */
  $("#tagline").textContent = SITE.tagline;
  $("#foot").textContent = SITE.title + " · © " + new Date().getFullYear() + " " + SITE.name;
  const cats = [...new Set(POEMS.map(p => p.category))];
  $("#arch-total").textContent = POEMS.length + " pieces · " + cats.length + " categories";

  const feat = POEMS.find(p => p.featured) || POEMS[0];
  const fBox = $("#feat");
  const fi = POEMS.indexOf(feat);
  const fText = el("div");
  const fq = el("blockquote", "", feat.text.split("\n").filter(l => l.trim()).slice(0, 4).join("\n").slice(0, 320));
  const fh = el("h3"); const fa = el("a", "", feat.title); fa.href = "#/poem/" + feat.id; fa.style.textDecoration = "none"; fh.append(fa);
  const fr = el("a", "link-arrow", "Read the full piece"); fr.href = fa.href;
  fText.append(metaEl(feat), fh, fq, fr);
  fBox.append(el("div", "feat-n", pad(fi)), fText);
  fBox.firstChild.setAttribute("aria-hidden", "true");

  const cl = $("#contact-list");
  const addContact = (label, text, href) => {
    const d = el("div"); d.append(el("span", "ui", label), el("br"));
    const a = el("a", "", text); a.href = href; d.append(a); cl.append(d);
  };
  if (SITE.email) addContact("Email", SITE.email, "mailto:" + SITE.email);
  if (SITE.phone) addContact("Mobile", SITE.phone, "tel:" + (SITE.phoneHref || SITE.phone));
  SITE.social.forEach(s => { if (s.href) addContact("Elsewhere", s.label, s.href); });

  /* ----- Archive: search + filter ----- */
  const state = { q: "", cat: "All" };
  const q = $("#q"), list = $("#list"), count = $("#count"), empty = $("#empty"), clear = $("#clear");
  const chips = $("#chips");
  ["All", ...cats].forEach(c => {
    const b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", c === "All");
    b.onclick = () => { state.cat = c; render(); };
    chips.append(b);
  });
  function render() {
    [...chips.children].forEach(b => b.setAttribute("aria-pressed", b.textContent === state.cat));
    const terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const out = POEMS.filter(p => (state.cat === "All" || p.category === state.cat) && terms.every(t => p.hay.includes(t)));
    list.replaceChildren();
    out.forEach(p => {
      const li = el("li"), a = el("a", "row"); a.href = "#/poem/" + p.id;
      const body = el("div"); body.append(el("h3", "", p.title), el("p", "", blurb(p)));
      a.append(el("span", "num", pad(POEMS.indexOf(p))), body, metaEl(p));
      li.append(a); list.append(li);
    });
    const filtered = terms.length || state.cat !== "All";
    count.textContent = filtered ? out.length + (out.length === 1 ? " piece" : " pieces") + " found" : "Showing all " + POEMS.length + " pieces";
    empty.hidden = out.length > 0;
    clear.hidden = !state.q;
  }
  const clearSearch = () => { state.q = ""; q.value = ""; render(); };
  q.addEventListener("input", () => { state.q = q.value; render(); });
  clear.onclick = () => { clearSearch(); q.focus(); };
  $("#reset").onclick = () => { state.cat = "All"; clearSearch(); q.focus(); };

  /* ----- Reader ----- */
  const reader = $("#reader"), home = $("#home"), piece = $("#piece"), bar = $("#progress");
  function showPiece(p) {
    const i = POEMS.indexOf(p), prev = POEMS[i - 1], next = POEMS[i + 1];
    piece.replaceChildren();
    const back = el("a", "back ui", "← Back to archive"); back.href = "#/archive";
    const head = el("header"), h1 = el("h1", "", p.title); h1.tabIndex = -1; h1.id = "piece-title";
    head.append(el("p", "ui cat", pad(i) + " · " + p.category), h1);
    if (p.subtitle) head.append(el("p", "sub", p.subtitle));
    const m = metaEl(p); m.firstChild.remove(); head.append(m);
    const prose = el("div", "prose"); prose.setAttribute("aria-labelledby", "piece-title");
    p.text.split(/\n\s*\n/).forEach(s => prose.append(el("p", "", s)));
    if (wordCount(p.text) > 250 && /^["“]?[A-Za-z]/.test(p.text.trim())) prose.classList.add("dc");
    const pn = el("nav", "pn"); pn.setAttribute("aria-label", "More pieces");
    const link = (x, label, side) => { const a = el("a"); a.href = "#/poem/" + x.id; a.append(el("span", "ui", label), el("strong", "", x.title)); return a; };
    pn.append(prev ? link(prev, "← Previous") : el("span"), next ? link(next, "Next →") : el("span"));
    piece.append(back, head, prose, el("p", "orn", "✦ ✦ ✦"), pn);
    document.title = p.title + " — " + SITE.title;
    window.scrollTo(0, 0); onScroll();
    h1.focus({ preventScroll: true });
  }
  function onScroll() {
    if (reader.hidden) return;
    const max = root.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, scrollY / max) : 0) + ")";
  }
  addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true });

  /* ----- Router ----- */
  let wasReader = false;
  function route() {
    const h = location.hash, m = h.match(/^#\/poem\/([\w-]+)/);
    const p = m && POEMS.find(x => x.id === m[1]);
    home.hidden = !!p; reader.hidden = !p;
    if (p) { wasReader = true; showPiece(p); return; }
    document.title = baseTitle; bar.style.transform = "scaleX(0)";
    const id = { "#/featured": "featured", "#/archive": "archive", "#/contact": "contact" }[h];
    requestAnimationFrame(() => {
      if (id) $("#" + id).scrollIntoView({ behavior: reduce || wasReader ? "auto" : "smooth" });
      else window.scrollTo(0, 0);
      wasReader = false;
    });
  }
  addEventListener("hashchange", route);

  /* ----- Keyboard: "/" focuses search, Esc clears / closes ----- */
  addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      if (reader.hidden) q.focus(); else { location.hash = "#/archive"; setTimeout(() => q.focus(), 80); }
    } else if (e.key === "Escape") {
      if (navList.classList.contains("open")) { setMenu(false); menuBtn.focus(); }
      else if (document.activeElement === q || state.q) { if (state.q) clearSearch(); else q.blur(); }
      else if (!reader.hidden) location.hash = "#/archive";
    }
  });

  render(); route();
})();
</script>
</body>
</html>
